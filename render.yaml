services:
  - type: web
    name: iana-ia
    env: node
    plan: free
    buildCommand: npm install && python -m pip install -r requirements.txt
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: IANA_API_KEY
        generateValue: true
      - key: START_PYTHON_API
        value: true
      - key: PYTHON_API_PORT
        value: 5000
      - key: SESSION_SECURE
        value: true
