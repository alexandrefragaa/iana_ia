services:
  - type: web
    name: iana-ia
    env: node
    plan: free
    buildCommand: npm install && python -m pip install -r requirements.txt
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_SECURE
        value: true
